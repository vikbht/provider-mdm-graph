[project]
name = "provider-mdm-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

dependencies = [
    "faker==20.1.0",
    "fastapi>=0.123.9",
    "mcp>=0.9.1",
    "neo4j==5.14.0",
    "pandas==2.1.3",
    "pydantic==2.5.0",
    "python-dotenv==1.0.0",
    "requests>=2.32.5",
    "uvicorn>=0.38.0",
]
[project.scripts]
provider-mdm-api = "app.api:app"
provider-mcp = "app.mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

